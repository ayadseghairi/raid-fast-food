name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js 22 (required by electron 45, better-sqlite3 13) ─
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Do NOT use the lockfile cache here — we delete the lockfile
          # below to force a clean Windows-native install.

      # ── 3. Install dependencies ───────────────────────────────────
      # We delete package-lock.json because it was generated on Linux
      # and therefore does NOT include the Windows-only optional natives
      # (e.g. @rollup/rollup-win32-x64-msvc, @swc/core-win32-x64-msvc).
      # A fresh `npm install` on Windows resolves and downloads the
      # correct platform-specific optional dependencies automatically.
      - name: Install dependencies (Windows-native)
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { Remove-Item package-lock.json }
          npm install --prefer-offline

      # ── 4. Build Vite renderer (dist/) ───────────────────────────
      - name: Build renderer
        run: npm run build

      # ── 5. Build Electron Windows NSIS installer ─────────────────
      - name: Build Electron app
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 6. Upload .exe to GitHub Release ─────────────────────────
      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: release/RaidFastFood-Setup-*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
