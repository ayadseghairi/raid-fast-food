name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-win:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 20 LTS — stable with Electron + better-sqlite3
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fix npm optional-dependency bug for rollup platform binaries:
      # delete package-lock + node_modules and reinstall fresh.
      - name: Install dependencies (npm install, not npm ci)
        run: |
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue
          npm install
        shell: pwsh

      - name: Run tests
        run: npm test

      - name: Build Vite + electron-builder
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaidFastFood-Windows-${{ github.ref_name }}
          path: release/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
