name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node 20 LTS ────────────────────────────────────────────
      # Node 22 + npm ci has a known bug with rollup optional platform
      # binaries (@rollup/rollup-win32-x64-msvc). Node 20 + npm install
      # (fresh, no lockfile) is the reliable fix.
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Install dependencies (no npm ci, no lockfile) ──────────
      # Avoids npm bug: https://github.com/npm/cli/issues/4828
      - name: Install dependencies
        run: |
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install
        shell: pwsh

      # ── 4. Run tests ──────────────────────────────────────────────
      - name: Run tests
        run: npm test

      # ── 5. Build Vite bundle + NSIS installer ─────────────────────
      - name: Build
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 6. Upload installer as workflow artifact ───────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaidFastFood-Setup-${{ github.ref_name }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 90

      # ── 7. Create GitHub Release on tag pushes ────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
