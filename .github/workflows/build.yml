name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Tests run on Linux (fast, no native rebuild needed) ──────────────
  test:
    name: Run tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  # ── Windows installer build ───────────────────────────────────────────
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: test

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node 20 LTS ────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Install dependencies (no npm ci, no lockfile) ──────────
      # Fixes npm bug: https://github.com/npm/cli/issues/4828
      # rollup optional platform binaries fail with npm ci on Windows.
      - name: Install dependencies
        run: |
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install
        shell: pwsh

      # ── 4. Rebuild better-sqlite3 for Electron ────────────────────
      # The prebuilt binary in node_modules is for Node.js; Electron
      # uses a different ABI. electron-builder handles this via
      # npmRebuild:false + asarUnpack, but we need the Node-native
      # binary for the test run. Skip rebuild here — tests run in job 1.
      - name: Rebuild native modules for Electron
        run: npx electron-rebuild -f -w better-sqlite3
        shell: pwsh

      # ── 5. Build Vite bundle + NSIS installer ─────────────────────
      - name: Build
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 6. Upload installer as workflow artifact ───────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RaidFastFood-Setup-${{ github.ref_name }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 90

      # ── 7. Create GitHub Release on tag pushes ────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
